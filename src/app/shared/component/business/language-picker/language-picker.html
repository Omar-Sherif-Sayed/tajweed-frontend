<div class="fixed inset-0 z-50 flex items-end justify-center bg-black/40 sm:items-center" (click)="closed.emit()" aria-hidden="true"></div>
<div
  class="fixed inset-x-0 bottom-0 z-50 mx-auto flex h-[84vh] w-full max-w-lg flex-col rounded-t-3xl bg-bg px-4 pt-3 text-text shadow-2xl sm:inset-y-0 sm:my-auto sm:h-[70vh] sm:rounded-3xl"
  role="dialog"
  aria-modal="true"
  aria-labelledby="language-picker-title"
>
  <div class="flex items-center justify-between pb-2">
    <b id="language-picker-title" class="text-sm">{{ 'firstLaunch.chooseLanguage' | translate }}</b>
    <button type="button" class="rounded-full px-2 py-1 text-muted" (click)="closed.emit()" [attr.aria-label]="'common.close' | translate">✕</button>
  </div>
  <label class="flex items-center gap-2 rounded-xl border border-border bg-surface px-3 py-2">
    <tj-icon name="search" class="text-muted" />
    <input
      #search
      type="search"
      autocomplete="off"
      class="min-w-0 flex-1 bg-transparent text-sm outline-none"
      [attr.aria-label]="'firstLaunch.chooseLanguage' | translate"
      [placeholder]="'firstLaunch.searchLanguages' | translate"
      (input)="onSearch($event)"
    />
  </label>
  <div class="-mx-4 mt-2 flex-1 overflow-auto px-4 pb-4">
    @if (!query()) {
      <h5 class="mx-0.5 mt-2.5 mb-1 text-xs font-semibold text-muted">{{ 'firstLaunch.deviceLanguage' | translate }}</h5>
      <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: suggested() }" />
      <h5 class="mx-0.5 mt-2.5 mb-1 text-xs font-semibold text-muted">{{ 'firstLaunch.allLanguages' | translate }}</h5>
    }
    @for (lang of matches(); track lang.code) {
      <ng-container [ngTemplateOutlet]="row" [ngTemplateOutletContext]="{ $implicit: lang }" />
    } @empty {
      <p class="mt-3 rounded-xl bg-dotsoft p-2.5 text-sm">{{ 'firstLaunch.noLanguage' | translate }}</p>
    }
  </div>
</div>

<ng-template #row let-lang>
  <button
    type="button"
    class="flex w-full items-center gap-2.5 border-b border-border px-1 py-2.5 text-start"
    [attr.aria-pressed]="lang.code === current()"
    (click)="chosen.emit(lang.code)"
  >
    @if (lang.code === current()) {
      <span class="size-1.5 rounded-full bg-dot" aria-hidden="true"></span>
    }
    <span class="text-[15px] font-bold" [attr.lang]="lang.code" [attr.dir]="lang.dir" [style.font-family]="lang.font">{{ lang.nativeName }}</span>
    <span class="text-xs text-muted">{{ nameIn(lang.code) }}</span>
    @if (lang.dir === 'rtl') {
      <span class="ms-auto rounded-full border border-rule px-2 text-[10px] font-bold text-muted">{{ 'firstLaunch.rightToLeft' | translate }}</span>
    }
  </button>
</ng-template>
