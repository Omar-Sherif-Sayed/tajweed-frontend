<h1 class="font-heading text-2xl font-bold text-ink">{{ 'nav.kids' | translate }}</h1>

<h2 class="mt-4 font-heading text-lg font-bold text-ink">{{ 'kids.surahs' | translate }}</h2>
<p class="text-sm text-muted">{{ 'kids.repeat' | translate }}</p>
@if (muallim().length > 1) {
  <label class="mt-2 flex flex-wrap items-center gap-2 text-sm">
    <span class="text-muted">{{ 'player.reciter' | translate }}</span>
    <select class="rounded-lg border border-border bg-page px-2 py-1.5" (change)="chosen.set(+$any($event.target).value)">
      @for (m of muallim(); track m.id) {
        <option [value]="m.id" [selected]="m.id === current()">{{ m.name }} · {{ 'player.MUALLIM' | translate }}</option>
      }
    </select>
  </label>
}
<ul class="mt-3 grid grid-cols-2 gap-2 sm:grid-cols-3 lg:grid-cols-4">
  @for (s of short(); track s.number) {
    <li>
      <button
        type="button"
        class="flex w-full items-center justify-between gap-2 rounded-xl border border-border bg-surface px-3 py-2 text-start text-sm"
        [disabled]="current() === null"
        (click)="listen(s.number)"
      >
        <span><span class="text-muted">{{ num(s.number) }}</span> · <span class="font-bold text-ink">{{ nameOf(s.number) }}</span></span>
        <span aria-hidden="true" class="text-dot">▶</span>
      </button>
    </li>
  }
</ul>

<h2 class="mt-6 font-heading text-lg font-bold text-ink">{{ 'kids.letters' | translate }}</h2>
<div class="mt-2 grid grid-cols-7 gap-2 text-center" lang="ar" dir="rtl">
  @for (l of letters; track l) {
    <span class="rounded-xl border border-border bg-page py-2 font-quran text-3xl text-ink">{{ l }}</span>
  }
</div>
<p class="mt-2 text-xs text-muted">{{ 'kids.lettersAudio' | translate }}</p>
